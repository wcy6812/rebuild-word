name: Desktop Pipeline Tests

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'desktop/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        run: pytest -v -m "not cuda"

      - name: Verify importability (CUDA-independent modules)
        run: python -c "from pipeline.word3 import loader; from pipeline import quality"
